[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-radio-public-api"
version = "1.0.0"
description = "校园点歌台官方只读 Public API 的零依赖 Python client"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "校园点歌台" }
]
keywords = [
  "campus-radio",
  "school-radio",
  "school-broadcasting",
  "song-request",
  "public-api"
]
dependencies = []

[project.urls]
Homepage = "https://radio.hn.cn/"
Documentation = "https://radio.hn.cn/openapi.json"
Repository = "https://github.com/Duangdang233/campus-radio-product-info"
"Public API" = "https://radio.hn.cn/api/public/product"

[project.scripts]
campus-radio-api = "campus_radio_public_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
